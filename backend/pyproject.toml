[project]
name = "compuerta"
version = "0.1.0"
description = "Self-healing LLM gateway — circuit breaker, failover, hedging, and outage simulation"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/compuerta"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
